analysis:
  model: "gemini-2.5-flash"
  max_articles: 30                       # 25→30 (다양성 확보 위해 LLM 입력 풀 확대)
  max_items: 6        # AUD-14: analyzer 프롬프트 "최대 6개"와 통일 (2026-06-12)
  max_age_days: 14
  freshness_days: 3   # 신선도 하드 컷 — pub_date 가 3일 초과 과거인 기사는 스코어링 전 drop (2026-06-12)
  max_per_source: 2   # 한 벤더(Anthropic 등) 독점 방지 — 소스 다양성

dedup:
  max_cache_size: 3000
  window_days: 60                        # 45→60 (2026-06-01 빈도 제한 강화: 더 오래 기억)
  file: "data/sent_hashes.json"         # 로컬 JSON 파일 (외부 DB 미사용)
  titles_file: "data/sent_titles.json"  # 제목 fuzzy dedup 영구 이력
  similarity_threshold: 0.50            # 0.55→0.50 (2026-06-05 PM 12955 "10번도넘게 또 떠" — 더 더 강한 fuzzy 차단)
  # 2026-06-04~06-05 PM 12782·12955 — 특정 콘텐츠 영구 차단 키워드 (normalize 후 부분일치 1건이면 발송 제외)
  deny_keywords:
    - "claude design"
    - "클로드 디자인"
    - "claude cowork"
    - "클로드 코워크"
    - "anthropic claude design labs"
    - "claude code 엔터프라이즈"
    - "claude code enterprise"
    - "claude code 엔터"
    - "엔터프라이즈 버전 출시"
    - "anthropic ai 기반 디자인 도구"

directive:
  file: "data/directives.json"    # 작업지시 로컬 저장 (supabase 완전 미사용)

